[tips-and-tricks-item-name]
apm-introduction=Amator Phasma's mods
apm-radiation=Radioactive items

[tips-and-tricks-item-description]
apm-introduction=The APM mods start you on burner and steam machines. The tips below show what inserters and radioactive items do differently with these mods.\nThe inserter functions are the map setting [font=default-semibold]Extended functions for inserter[/font] (on by default with APM Power).
apm-radiation=Radioactive items such as [item=uranium-235] hurt you while they are in your inventory or in your hand. You hear a Geiger counter, and the item tooltip shows how radioactive it is.\nMore radioactive items hurt more. Keep them in chests and let inserters and robots move them.\nIn the map settings the damage can be turned off, multiplied, or made to grow with the number of items you carry.
