[tips-and-tricks-item-description]
apm-fuel-chaining=An inserter between two burner machines also passes fuel along: when the first machine has at least 5 fuel and the next one less than 5, it moves fuel into the next machine's fuel slot.\nSo a row of [entity=apm_assembling_machine_0] only needs fuel at the start of the row.
apm-fuel-leech=A [entity=burner-inserter] without fuel takes some from the fuel slot of the machine it takes from or puts into, even when it only carries other items. It only takes fuel it can burn and leaves at least one item in the slot.
apm-ash-chaining=Burner machines produce [item=apm_generic_ash]. An inserter that moves items from one burner machine into the next one also moves the ash along, into the next machine's burnt-result slot, as soon as there is a batch of it (10% of the ash stack; checked about every 17 seconds). The inserter at the end of the chain puts it into a chest or onto a belt.\nSo one inserter at the end of a chain clears the ash of the whole chain.
apm-refined-fuel=Some burners only take refined fuel like coke [item=apm_coke] or solid fuel [item=solid-fuel], not coal [item=coal] or wood [item=wood]: the [entity=boiler] boiler, the [entity=steel-furnace] steel furnace, the [entity=apm_puddling_furnace_0] puddling furnace and the coking plants from tier 2 on [entity=apm_coking_plant_1]. If such a machine shows the no-fuel icon although coal is right next to it, it needs refined fuel.\nCoke: coal → crusher → crushed coal [item=apm_coal_crushed] → press → coal briquettes [item=apm_coal_briquette] → [entity=apm_coking_plant_0] coking plant → coke. Burning coke leaves no ash.
apm-crushing-sifting=[entity=apm_crusher_machine_0] The crusher breaks stone, coal, coke and wood into smaller pieces ([item=apm_crushed_stone] [item=apm_coal_crushed] [item=apm_coke_crushed] [item=apm_wood_pellets]) for later recipes.\n[entity=apm_sieve_0] The sieve sifts dry mud [item=apm_dry_mud] with a sieve [item=apm_sieve_iron]: a quarter of the time it finds ore, and the sieve wears out one time in 20.
apm-ash-uses=[item=apm_generic_ash] Ash stacks up to 2000 by default (startup setting). Use it for:\n[item=landfill] landfill (ash + stone), [item=apm_asphalt] asphalt (ash + creosote), [item=apm_fertiliser_1] fertiliser, raw stone bricks in the press, and in a centrifuge: washing ash with sulfuric acid sometimes gives [item=uranium-ore] uranium ore.
apm-sinkhole=[entity=apm_sinkhole] A sinkhole destroys any fluid that is piped into it: use it for fluids you have no use for, like wastewater or excess steam. [entity=apm_sinkhole_small] The small sinkhole does the same in one tile.
apm-steam-inserters=[entity=apm_steam_inserter] Steam inserters and [entity=apm_steam_inserter_long] long steam inserters run on steam instead of electricity or fuel. Connect a steam pipe to the side of the inserter (across the direction the items move); the steam flows through it to the next pipe or steam inserter, so a row of steam inserters shares one pipe.
apm-equipment-manager=[item=apm_equipment_burner_generator_basic] Burner generators in your armour need fuel. Turn on the equipment manager with __CONTROL__apm_input_equipment_manager__ or its shortcut: it refuels all burner equipment from your inventory (up to 10 fuel items, as long as there is still at least 1 in the slot) and moves the ash into your inventory. It warns you when fuel runs low.
