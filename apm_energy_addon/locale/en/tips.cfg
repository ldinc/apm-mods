[tips-and-tricks-item-name]
apm-batteries-as-fuel=Batteries as fuel
apm-charging-stations=Charging and discharging stations
apm-energy-transmitter=Battery energy transmitter

[tips-and-tricks-item-description]
apm-batteries-as-fuel=[entity=apm_electric_car] Electric cars, tanks and locomotives burn charged batteries [item=battery] (4 MJ each). A used battery comes out discharged [item=apm_discharged_battery]: recharge it in a charging station.\n[item=apm_rtg_radioisotope_thermoelectric_generator] An RTG works as fuel too (1 GJ). It comes out decayed [item=apm_decayed_rtg]; reprocess it in a chemical plant.
apm-charging-stations=[entity=apm_battery_charging_station] The charging station (5 MW) turns 6 discharged batteries into 5 charged ones, plus a sixth with 85% chance: about 1 battery in 40 is lost per charge.\n[entity=apm_battery_discharging_station] The discharging station burns charged batteries and gives up to 10 MW of electricity. So batteries can carry power to a grid that has no power plant.
apm-energy-transmitter=[item=apm_equipment_energy_transmitter] Put it in your armour: it burns charged batteries (or an RTG) and gives 200 kW to the equipment grid. With the equipment manager (__CONTROL__apm_input_equipment_manager__) on, it is refuelled from your inventory.
