[tips-and-tricks-item-description]
apm-nuclear-fuel-rods=[item=apm_fuel_rod_uranium] Fuel rods burn in the [entity=nuclear-reactor] and come out hot: [item=apm_fuel_rod_uranium_active] (280 °C).\n1. [entity=apm_cooling_pond_0] Cooling pond: 6 hot rods + water → 6 cooled rods [item=apm_fuel_rod_uranium_cooled], hot water and radioactive wastewater.\n2. Chemical plant, recovery stage A: cooled rod + sulfuric acid → worn containment [item=apm_fuel_rod_container_worn] + PUREX solution.\n3. Chemical plant, recovery stage B: PUREX solution → oxide pellets for new rods, and radioactive waste.\n4. Maintenance: 5 worn containments + steel + water → 4 (sometimes 5) containments [item=apm_fuel_rod_container].\nMOX, thorium and neptunium rods go the same way.
apm-nuclear-cooling=[entity=apm_cooling_pond_0] The cooling pond cools hot spent fuel. It takes water and gives hot water [fluid=apm_hot_water] and radioactive wastewater [fluid=apm_radioactive_wastewater].\n[entity=apm_hybrid_cooling_tower_0] The hybrid water cooling facility turns hot water back into water (500 → 500), so the water can go back to the pond.\nRadioactive wastewater: recycle it in a chemical plant (waste container + 500 wastewater → 400 water, a neptunium pellet and radioactive waste), or destroy it in a sinkhole (APM Power).
apm-nuclear-breeder=[entity=apm_nuclear_breeder] The breeding reactor mainly breeds heavy elements; it also gives heat.\n1. Breeder inventory [item=apm_breeder_uranium] + MOX fuel rod → loaded [item=apm_breeder_uranium_loaded].\n2. Burn it in the breeding reactor → enriched and hot [item=apm_breeder_uranium_active] (380 °C).\n3. Cooling pond → cooled [item=apm_breeder_uranium_cooled].\n4. Unloading → unloaded inventory [item=apm_breeder_uranium_seperated] + a used MOX rod.\n5. Chemical plant: separation → uranium, plutonium and neptunium pellets; the containment comes back worn.\nThorium breeder inventories go the same way.
apm-nuclear-radioactive-items=Many nuclear items hurt you while you carry them:\nSlightly: [item=apm_yellowcake] [item=apm_oxide_pellet_th232] [item=apm_oxide_pellet_np237] [item=apm_fuel_rod_uranium] [item=apm_fuel_rod_thorium] [item=apm_fuel_rod_neptunium] [item=apm_fuel_rod_neptunium_cooled] [item=apm_breeder_uranium] [item=apm_breeder_thorium] [item=apm_fuel_rod_container_worn] [item=apm_breeder_container_worn] [item=apm_radioactive_waste]\nModerately: [item=apm_oxide_pellet_u235] [item=apm_fuel_rod_mox] [item=apm_fuel_rod_uranium_cooled] [item=apm_fuel_rod_mox_cooled] [item=apm_fuel_rod_thorium_cooled] [item=apm_fuel_rod_neptunium_active] [item=apm_breeder_uranium_loaded] [item=apm_breeder_uranium_cooled] [item=apm_breeder_uranium_seperated] [item=apm_breeder_thorium_loaded] [item=apm_breeder_thorium_cooled] [item=apm_breeder_thorium_seperated]\nHighly: [item=apm_oxide_pellet_pu239] [item=apm_fuel_rod_uranium_active] [item=apm_fuel_rod_mox_active] [item=apm_fuel_rod_thorium_active] [item=apm_breeder_uranium_active] [item=apm_breeder_thorium_active]\nHot spent fuel is the worst: move it with inserters straight into the cooling pond.
apm-nuclear-vehicles=Some vehicles run on uranium fuel rods [item=apm_fuel_rod_uranium]. They hold one rod, and the spent rod comes out hot, like from a reactor: take it out and cool it in a cooling pond.
